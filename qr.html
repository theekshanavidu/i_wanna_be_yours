<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Printable Heart QR Gift Card Generator 💖🐾</title>
  
  <!-- Cute Heart Tab Favicon -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%23ff758f'/%3E%3Cstop offset='50%25' stop-color='%23ff4d6d'/%3E%3Cstop offset='100%25' stop-color='%23c9184a'/%3E%3C/linearGradient%3E%3C/defs%3E%3Cpath d='M32 15 C26 5 12 5 6 17 C0 29 10 41 32 57 C54 41 64 29 58 17 C52 5 38 5 32 15 Z' fill='url(%23g)'/%3E%3Cpath d='M14 14 C18 10 24 11 26 14 C27 16 25 18 22 17 C17 16 15 18 14 21 C13 23 11 23 11 21 C11 18 12 15 14 14 Z' fill='%23ffffff' opacity='0.8'/%3E%3Cpath d='M48 12 L50 16 L54 18 L50 20 L48 24 L46 20 L42 18 L46 16 Z' fill='%23ffd166'/%3E%3C/svg%3E">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/images/favicon.png">
  <link rel="shortcut icon" href="favicon.ico">
  <link rel="apple-touch-icon" href="assets/images/favicon.png">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Quicksand:wght@500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #fff5f7 0%, #fedee7 100%);
      font-family: 'Quicksand', sans-serif;
      color: #4a3e3d;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
    }

    .page-title {
      font-size: 2.2rem;
      font-weight: 800;
      color: #c9184a;
      text-align: center;
      margin-bottom: 8px;
    }

    .page-subtitle {
      font-size: 1rem;
      color: #8d7b78;
      text-align: center;
      margin-bottom: 30px;
    }

    .container {
      display: flex;
      flex-wrap: wrap;
      gap: 36px;
      justify-content: center;
      max-width: 1000px;
      width: 100%;
    }

    /* Controls Panel */
    .controls-panel {
      flex: 1;
      min-width: 300px;
      max-width: 440px;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(12px);
      border: 2px solid rgba(255, 182, 193, 0.5);
      border-radius: 24px;
      padding: 28px 24px;
      box-shadow: 0 10px 30px rgba(255, 117, 143, 0.15);
    }

    .input-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-weight: 700;
      color: #c9184a;
      margin-bottom: 8px;
      font-size: 0.95rem;
    }

    input[type="text"] {
      width: 100%;
      padding: 12px 16px;
      border-radius: 12px;
      border: 2px solid #ffccd5;
      font-family: 'Quicksand', sans-serif;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s ease;
    }

    input[type="text"]:focus {
      border-color: #ff4d6d;
    }

    .btn-action {
      width: 100%;
      background: linear-gradient(135deg, #ff758f 0%, #ff4d6d 100%);
      color: #ffffff;
      border: none;
      border-radius: 999px;
      padding: 14px 20px;
      font-family: 'Quicksand', sans-serif;
      font-size: 1rem;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(255, 77, 109, 0.35);
      transition: all 0.3s ease;
      margin-top: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-action:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 26px rgba(255, 77, 109, 0.45);
    }

    .btn-secondary {
      background: #ffffff;
      color: #c9184a;
      border: 2px solid #ffccd5;
      box-shadow: 0 4px 12px rgba(255, 182, 193, 0.2);
    }

    /* Card Preview Display */
    .card-preview-wrapper {
      flex: 1;
      min-width: 320px;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .gift-card-paper {
      width: 100%;
      background: #ffffff;
      border: 3px solid #ffccd5;
      border-radius: 28px;
      padding: 36px 24px 30px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(255, 117, 143, 0.25);
      position: relative;
    }

    .card-cats-art {
      width: 100%;
      max-width: 180px;
      height: 110px;
      margin: 0 auto 10px;
    }

    .card-cats-art img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .card-preview-title {
      font-size: 1.4rem;
      font-weight: 800;
      color: #c9184a;
      margin-bottom: 4px;
    }

    .card-preview-sub {
      font-size: 0.85rem;
      color: #8d7b78;
      font-weight: 600;
      margin-bottom: 20px;
    }

    .heart-qr-frame {
      position: relative;
      width: 250px;
      height: 250px;
      margin: 0 auto 15px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .qr-holder {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .heart-qr-canvas {
      max-width: 100%;
      height: auto;
      display: block;
      filter: drop-shadow(0 10px 24px rgba(255, 77, 109, 0.28));
      transition: transform 0.3s ease;
    }

    .heart-qr-canvas:hover {
      transform: scale(1.03);
    }

    .card-preview-quote {
      font-family: 'Caveat', cursive;
      font-size: 1.45rem;
      color: #c9184a;
      font-weight: 700;
      margin-top: 10px;
    }

    .card-passcode-badge {
      display: inline-block;
      margin-top: 12px;
      background: #fff0f3;
      border: 1.5px dashed #ff758f;
      color: #c9184a;
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 0.82rem;
      font-weight: 700;
    }

    @media print {
      body {
        background: #ffffff;
        padding: 0;
      }
      .controls-panel, .page-title, .page-subtitle {
        display: none !important;
      }
      .gift-card-paper {
        box-shadow: none;
        border: 2px solid #ff758f;
        margin: 20px auto;
        page-break-inside: avoid;
      }
    }
  </style>
</head>
<body>

  <h1 class="page-title">Heart-Shaped QR Gift Card 💖🐾</h1>
  <p class="page-subtitle">Generate & download an adorable printable card for your girlfriend's surprise gift!</p>

  <div class="container">
    
    <!-- Left: Settings & Controls -->
    <div class="controls-panel">
      <div class="input-group">
        <label for="input-url">Website URL (What the QR opens):</label>
        <input type="text" id="input-url" placeholder="https://your-cute-site.netlify.app">
      </div>

      <div class="input-group">
        <label for="input-title">Card Title:</label>
        <input type="text" id="input-title" value="A Surprise For My Princess 🐾💖">
      </div>

      <div class="input-group">
        <label for="input-sub">Subtitle Instruction:</label>
        <input type="text" id="input-sub" value="Scan with your camera to open my heart">
      </div>

      <div class="input-group">
        <label for="input-pin">Passcode Hint on Card (Optional):</label>
        <input type="text" id="input-pin" value="Secret Passcode: 0711 🐾 (Hint: Anniversary MMDD)">
      </div>

      <button id="btn-update-qr" class="btn-action">
        <span>✨</span> Update QR Code
      </button>

      <button id="btn-download-card" class="btn-action" style="margin-top: 12px;">
        <span>📥</span> Download Card as Image (PNG)
      </button>

      <button onclick="window.print()" class="btn-action btn-secondary" style="margin-top: 12px;">
        <span>🖨️</span> Print Card Directly
      </button>

      <a href="index.html" class="btn-action btn-secondary" style="margin-top: 12px; text-decoration: none; text-align: center;">
        <span>🐾</span> Back to Surprise Website
      </a>
    </div>

    <!-- Right: Card Preview -->
    <div class="card-preview-wrapper">
      <div id="printable-card" class="gift-card-paper">
        <div class="card-cats-art">
          <img src="assets/images/cat-couple-main.svg" alt="Cat Couple">
        </div>

        <h2 id="card-title-text" class="card-preview-title">A Surprise For My Princess 🐾💖</h2>
        <p id="card-sub-text" class="card-preview-sub">Scan with your camera to open my heart</p>

        <div class="heart-qr-frame">
          <div id="qr-preview-holder" class="qr-holder"></div>
        </div>

        <div class="card-preview-quote">"My favorite place will always be right by your side"</div>
        <div id="card-pin-badge" class="card-passcode-badge">Secret Passcode: 0711 🐾</div>
      </div>
    </div>

  </div>

  <script src="config.js"></script>
  <script src="assets/qrcode.min.js"></script>
  <script src="assets/heart-qr.js"></script>
  <script>
    const urlInput = document.getElementById('input-url');
    const titleInput = document.getElementById('input-title');
    const subInput = document.getElementById('input-sub');
    const pinInput = document.getElementById('input-pin');

    const cardTitle = document.getElementById('card-title-text');
    const cardSub = document.getElementById('card-sub-text');
    const cardPin = document.getElementById('card-pin-badge');
    const qrHolder = document.getElementById('qr-preview-holder');

    // Default URL to current host / index.html
    const defaultUrl = window.location.href.replace('qr.html', 'index.html');
    urlInput.value = (CONFIG && CONFIG.siteUrl) ? CONFIG.siteUrl : defaultUrl;

    function renderQr() {
      const url = urlInput.value.trim() || defaultUrl;
      qrHolder.innerHTML = '';
      
      // Render true Heart-Shaped QR Canvas (Camouflaged seamlessly)
      const heartCv = createHeartQRCanvas(url, 250, {
        colorDark: "#c9184a",
        colorLight: "#ffffff",
        strokeColor: "#ff758f"
      });

      if (heartCv) {
        heartCv.className = 'heart-qr-canvas';
        qrHolder.appendChild(heartCv);
      }

      cardTitle.textContent = titleInput.value;
      cardSub.textContent = subInput.value;
      if (pinInput.value.trim()) {
        cardPin.style.display = 'inline-block';
        cardPin.textContent = pinInput.value;
      } else {
        cardPin.style.display = 'none';
      }
    }

    document.getElementById('btn-update-qr').addEventListener('click', renderQr);
    urlInput.addEventListener('input', renderQr);
    titleInput.addEventListener('input', () => cardTitle.textContent = titleInput.value);
    subInput.addEventListener('input', () => cardSub.textContent = subInput.value);
    pinInput.addEventListener('input', () => cardPin.textContent = pinInput.value);

    // Initial render
    renderQr();

    // Download High-Resolution Printable PNG Card
    document.getElementById('btn-download-card').addEventListener('click', () => {
      const cardCanvas = document.createElement('canvas');
      cardCanvas.width = 600;
      cardCanvas.height = 800;
      const ctx = cardCanvas.getContext('2d');

      // Gradient background
      const grad = ctx.createLinearGradient(0, 0, 0, 800);
      grad.addColorStop(0, '#fff5f7');
      grad.addColorStop(1, '#ffe3eb');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 600, 800);

      // Border
      ctx.strokeStyle = '#ffccd5';
      ctx.lineWidth = 10;
      ctx.strokeRect(20, 20, 560, 760);

      // Title & Subtitle
      ctx.fillStyle = '#c9184a';
      ctx.font = 'bold 32px "Quicksand", sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(titleInput.value, 300, 105);

      ctx.fillStyle = '#8d7b78';
      ctx.font = '600 18px "Quicksand", sans-serif';
      ctx.fillText(subInput.value, 300, 145);

      // Render crisp high-res Heart QR directly on download card
      const url = urlInput.value.trim() || defaultUrl;
      const highResHeartCv = createHeartQRCanvas(url, 420, {
        colorDark: "#c9184a",
        colorLight: "#ffffff",
        strokeColor: "#ff758f"
      });

      if (highResHeartCv) {
        ctx.drawImage(highResHeartCv, 90, 195, 420, 420);
      }

      // Romantic quote
      ctx.fillStyle = '#c9184a';
      ctx.font = 'italic bold 28px "Caveat", cursive';
      ctx.fillText('"My favorite place will always be right by your side"', 300, 680);

      if (pinInput.value.trim()) {
        ctx.fillStyle = '#ff4d6d';
        ctx.font = 'bold 18px "Quicksand", sans-serif';
        ctx.fillText(pinInput.value, 300, 725);
      }

      const link = document.createElement('a');
      link.download = 'Heart_QR_Gift_Card.png';
      link.href = cardCanvas.toDataURL('image/png');
      link.click();
    });
  </script>
</body>
</html>
