<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="boxPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff9ebb"/>
      <stop offset="100%" stop-color="#ff758f"/>
    </linearGradient>
    <linearGradient id="lidPink" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffb3c6"/>
      <stop offset="100%" stop-color="#ff8da1"/>
    </linearGradient>
    <linearGradient id="goldRibbon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffe6a7"/>
      <stop offset="50%" stop-color="#ffd166"/>
      <stop offset="100%" stop-color="#f4a261"/>
    </linearGradient>
    <filter id="giftShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#f43f5e" flood-opacity="0.3"/>
    </filter>
  </defs>

  <g filter="url(#giftShadow)">
    <!-- Box Body -->
    <rect x="35" y="80" width="130" height="95" rx="16" fill="url(#boxPink)"/>
    <!-- Box Lid -->
    <rect x="25" y="65" width="150" height="28" rx="12" fill="url(#lidPink)"/>

    <!-- Vertical Gold Ribbon -->
    <rect x="88" y="80" width="24" height="95" fill="url(#goldRibbon)"/>
    <rect x="88" y="65" width="24" height="28" fill="url(#goldRibbon)"/>

    <!-- Horizontal Gold Ribbon on Box -->
    <rect x="35" y="118" width="130" height="18" fill="url(#goldRibbon)"/>

    <!-- Gorgeous Fluffy Ribbon Bow on Top -->
    <g id="ribbon-bow" transform="translate(100, 65)">
      <!-- Left loop -->
      <path d="M0,0 C-25,-30 -50,-10 -25,2 C-10,8 0,0 0,0 Z" fill="url(#goldRibbon)"/>
      <path d="M-8,-2 C-22,-20 -40,-6 -20,2 Z" fill="#e76f51" opacity="0.4"/>
      <!-- Right loop -->
      <path d="M0,0 C25,-30 50,-10 25,2 C10,8 0,0 0,0 Z" fill="url(#goldRibbon)"/>
      <path d="M8,-2 C22,-20 40,-6 20,2 Z" fill="#e76f51" opacity="0.4"/>
      <!-- Ribbon Center Knot -->
      <circle cx="0" cy="0" r="10" fill="#f4a261"/>
      <circle cx="0" cy="0" r="7" fill="#ffe6a7"/>
      <!-- Ribbon Tails -->
      <path d="M-5,5 Q-18,25 -25,35 Q-16,33 -10,38 Q-3,22 0,5 Z" fill="url(#goldRibbon)"/>
      <path d="M5,5 Q18,25 25,35 Q16,33 10,38 Q3,22 0,5 Z" fill="url(#goldRibbon)"/>
    </g>

    <!-- Little Cute Heart Sparkle -->
    <path d="M150,140 C146,134 138,136 138,142 C138,148 150,154 150,156 C150,154 162,148 162,142 C162,136 154,134 150,140 Z" fill="#ffffff" opacity="0.9"/>
  </g>
</svg>

