<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" width="100%" height="100%">
  <defs>
    <linearGradient id="roseRedR" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4d6d"/>
      <stop offset="100%" stop-color="#a4133c"/>
    </linearGradient>
    <linearGradient id="rosePinkR" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff85a1"/>
      <stop offset="100%" stop-color="#ff477e"/>
    </linearGradient>
    <linearGradient id="leafGradR" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#74c69d"/>
      <stop offset="100%" stop-color="#2d6a4f"/>
    </linearGradient>
  </defs>

  <g transform="translate(260, 20) scale(-1, 1)">
    <!-- Leaves background -->
    <path d="M40,160 Q-20,100 10,40 Q60,80 40,160 Z" fill="url(#leafGradR)" opacity="0.9"/>
    <path d="M120,180 Q160,80 120,10 Q80,70 120,180 Z" fill="url(#leafGradR)" opacity="0.85"/>
    <path d="M10,220 Q-50,200 -20,130 Q30,170 10,220 Z" fill="url(#leafGradR)" opacity="0.8"/>

    <!-- Soft pink peony -->
    <g transform="translate(60, 110)">
      <circle cx="0" cy="0" r="42" fill="url(#rosePinkR)"/>
      <circle cx="-10" cy="-6" r="28" fill="#ffb3c6" opacity="0.7"/>
      <circle cx="10" cy="8" r="24" fill="#ff758f" opacity="0.6"/>
      <circle cx="0" cy="0" r="14" fill="#ffffff" opacity="0.8"/>
    </g>

    <!-- Deep red Rose -->
    <g transform="translate(130, 170)">
      <circle cx="0" cy="0" r="48" fill="url(#roseRedR)"/>
      <path d="M-20,-10 C-10,-35 25,-25 22,5 C18,30 -22,25 -20,-10 Z" fill="#800f2f" opacity="0.8"/>
      <circle cx="0" cy="0" r="18" fill="#ff4d6d"/>
      <circle cx="0" cy="0" r="8" fill="#ffb3c6"/>
    </g>

    <!-- Baby's breath & buds -->
    <circle cx="15" cy="85" r="7" fill="#ffffff" stroke="#ffccd5" stroke-width="2"/>
    <circle cx="35" cy="65" r="6" fill="#ffffff" stroke="#ffccd5" stroke-width="2"/>
    <circle cx="150" cy="80" r="8" fill="#ffffff" stroke="#ffccd5" stroke-width="2"/>
    <circle cx="175" cy="115" r="6" fill="#ffffff" stroke="#ffccd5" stroke-width="2"/>

    <!-- Peach Tulip -->
    <g transform="translate(30, 220)">
      <path d="M-22,10 C-26,-20 0,-36 0,-36 C0,-36 26,-20 22,10 C10,22 -10,22 -22,10 Z" fill="#ffb703"/>
      <ellipse cx="0" cy="-2" rx="7" ry="16" fill="#fb8500"/>
    </g>

    <!-- Lower Rose -->
    <g transform="translate(95, 270)">
      <circle cx="0" cy="0" r="44" fill="url(#rosePinkR)"/>
      <circle cx="-6" cy="-4" r="26" fill="#ffccd5" opacity="0.8"/>
      <circle cx="0" cy="0" r="12" fill="#c9184a"/>
    </g>
  </g>
</svg>

